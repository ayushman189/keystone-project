spring.application.name=keystone-backend

# Server
server.port=${PORT:8080}

# CORS (comma-separated list of allowed origins)
app.cors.allowed-origins=${KEYSTONE_CORS_ORIGINS:http://localhost:5173}

# JWT
app.jwt.secret=${KEYSTONE_JWT_SECRET:c29tZS12ZXJ5LXNlY3VyZS1rZXlzdG9uZS1qd3Qtc2VjcmV0LWtleS0yMDI2}

# PostgreSQL
spring.datasource.url=${KEYSTONE_DB_URL:jdbc:postgresql://127.0.0.1:5433/keystone_db}
spring.datasource.username=${KEYSTONE_DB_USERNAME:postgres}
spring.datasource.password=${KEYSTONE_DB_PASSWORD:postgres_password}
spring.datasource.driver-class-name=${KEYSTONE_DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
