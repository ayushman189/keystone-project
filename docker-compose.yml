services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone_postgres

    environment:
      POSTGRES_DB: keystone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: